<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ระบบงานสารบรรณ รับ-ส่ง-คำสั่ง-บันทึกข้อความ สำหรับโรงเรียน">
  <title>เข้าสู่ระบบ | ระบบงานสารบรรณ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-animated"></div>

  <!-- Loading -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">กำลังดำเนินการ...</div>
  </div>

  <!-- Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Sweet Confirm -->
  <div class="sweet-overlay" id="sweetOverlay">
    <div class="sweet-card">
      <div class="sweet-icon">⚠️</div>
      <div class="sweet-title">ยืนยันการดำเนินการ</div>
      <div class="sweet-message"></div>
      <div class="sweet-buttons">
        <button class="btn btn-danger" id="sweetConfirm">✅ ยืนยัน</button>
        <button class="btn" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);" id="sweetCancel">❌ ยกเลิก</button>
      </div>
    </div>
  </div>

  <!-- LOGIN PAGE -->
  <div class="login-page">
    <div class="login-card">
      <!-- Logo -->
      <div class="login-logo">
        <div id="loginLogoDisplay">
          <div class="login-logo-placeholder">🏫</div>
        </div>
        <div class="login-school-name" id="loginSchoolName">โรงเรียน............</div>
        <div class="login-system-name">ระบบงานสารบรรณ รับ-ส่ง-คำสั่ง-บันทึกข้อความ</div>
      </div>

      <div class="login-title">🔐 เข้าสู่ระบบ</div>

      <!-- Role Tabs -->
      <div class="role-tabs">
        <button class="role-tab active" data-role="admin" onclick="selectRole('admin')">👑 ผู้ดูแล</button>
        <button class="role-tab" data-role="teacher" onclick="selectRole('teacher')">👨‍🏫 ครู</button>
        <button class="role-tab" data-role="officer" onclick="selectRole('officer')">👷 เจ้าหน้าที่</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="login-input-group">
          <span class="login-input-icon">👤</span>
          <input type="text" id="loginUsername" class="login-input" placeholder="ชื่อผู้ใช้" autocomplete="username" required>
        </div>
        <div class="login-input-group">
          <span class="login-input-icon">🔑</span>
          <input type="password" id="loginPassword" class="login-input" placeholder="รหัสผ่าน" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-login">
          <span>🚀</span> เข้าสู่ระบบ
        </button>
      </form>

      <div style="margin-top:20px;text-align:center;font-size:12px;color:rgba(255,255,255,0.3);">
        ระบบงานสารบรรณ v1.0 &nbsp;|&nbsp; <span style="color:rgba(38,166,154,0.5);">Powered by School System</span>
      </div>
    </div>
  </div>

  <script src="js/core.js"></script>
  <script>
    let selectedRole = 'admin';

    function selectRole(role) {
      selectedRole = role;
      document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`[data-role="${role}"]`).classList.add('active');
    }

    function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      showLoading('กำลังตรวจสอบข้อมูล...');
      setTimeout(() => {
        hideLoading();
        const users = getStorage(STORAGE.users, DEFAULT_USERS);
        const user = users.find(u =>
          u.username === username &&
          u.password === password &&
          u.role === selectedRole
        );
        if (user) {
          setSession(user);
          showToast('เข้าสู่ระบบสำเร็จ', `ยินดีต้อนรับ ${user.name}`, 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 800);
        } else {
          showToast('เข้าสู่ระบบล้มเหลว', 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง', 'error');
        }
      }, 900);
    }

    // Init
    initApp();
    updateNavbar();

    // Check session
    const session = getSession();
    if (session) {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
